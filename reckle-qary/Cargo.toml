[package]
name = "reckle-qary"
version = "0.1.0"
edition = "2021"

[dependencies]
plonky2 = { version = "1.1.0", default-features = false, features = ["std", "parallel", "timing"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The benchmark is a plain binary (not a `cargo bench` harness) so it can emit
# machine-readable JSON and be run selectively in CI.
[[bin]]
name = "bench"
path = "src/bin/bench.rs"

